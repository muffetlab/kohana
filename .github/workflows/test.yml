name: Run Tests

on:
  push:
    branches: [ develop, master, php85 ]
  pull_request:
    branches: [ develop, master ]

jobs:
  build:
    name: PHP ${{ matrix.php-versions }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.4', '8.5']

    services:
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kohana
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kohana
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer
          extensions: memcached, apcu, redis, gd, mysqli, pdo_mysql, pdo_pgsql, pdo_sqlite
          ini-values: apc.enable_cli=1

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-versions }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-versions }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Configure test database
        run: |
          cat > application/config/database.php <<'EOF'
          <?php
          return [
              'default' => [
                  'type' => 'PDO',
                  'connection' => ['dsn' => 'mysql:host=127.0.0.1;dbname=kohana', 'username' => 'root', 'password' => 'root', 'persistent' => false],
                  'table_prefix' => '',
                  'charset' => 'utf8mb4',
              ],
              'mysqli' => [
                  'type' => 'MySQLi',
                  'connection' => ['hostname' => '127.0.0.1', 'database' => 'kohana', 'username' => 'root', 'password' => 'root', 'persistent' => false],
                  'table_prefix' => '',
                  'charset' => 'utf8mb4',
              ],
              'pgsql' => [
                  'type' => 'pgsql',
                  'connection' => ['hostname' => '127.0.0.1', 'port' => 5432, 'database' => 'kohana', 'username' => 'postgres', 'password' => 'postgres', 'persistent' => false],
                  'table_prefix' => '',
                  'charset' => 'UTF8',
              ],
          ];
          EOF

      - name: Run test suite
        run: vendor/bin/pest
